<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Async Script Loading Test - Page 3</title>
    <script src="../../../src/htmx.js"></script>
    <script src="../../../src/ext/hx-head.js"></script>
    <script src="async-script.js" async></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { margin: 10px 0; padding: 10px; background: #f0f0f0; }
        .loaded { color: green; }
        .error { color: red; }
    </style>
</head>
<body hx-ext="hx-head">

<h1>Async Script Loading Test - Page 3</h1>

<div class="status">
    <div>Page 3 loaded</div>
    <div id="sync-script-status">Sync script: Not loaded</div>
    <div id="async-script-status">Async script: Checking...</div>
</div>

<a hx-boost="true" href="async-test-index.html">Back to Page 1</a><br>
<a hx-boost="true" href="async-test-page2.html">Go to Page 2 (with sync script)</a>

<div id="content">Content Area - Page 3 (async script may load before or after swap)</div>

<script>
    // Check immediately - async script may not be loaded yet
    setTimeout(() => {
        if (window.asyncScriptLoaded) {
            document.getElementById('async-script-status').innerHTML = 'Async script: <span class="loaded">✓ Loaded</span>';
        } else {
            document.getElementById('async-script-status').innerHTML = 'Async script: <span class="error">Still loading...</span>';
            // Check again later
            setTimeout(() => {
                if (window.asyncScriptLoaded) {
                    document.getElementById('async-script-status').innerHTML = 'Async script: <span class="loaded">✓ Loaded (after swap)</span>';
                }
            }, 1000);
        }
    }, 100);
</script>

</body>
</html>
