<hx-dialog modal aria-label="Select an avatar" style="max-width:420px" data-dialog-type="avatar-picker">
  <h2>Choose avatar</h2>
  <p>Pick one — this dialog uses <code>aria-label</code>, <code>style</code> for custom width, and <code>data-dialog-type</code> as a JS/CSS hook.</p>
  <div style="display:flex;gap:.75rem;flex-wrap:wrap;margin-top:.5rem">
    <button style="font-size:2rem;background:none;border:2px solid transparent;border-radius:8px;cursor:pointer;padding:.25rem" aria-label="Cat">🐱</button>
    <button style="font-size:2rem;background:none;border:2px solid transparent;border-radius:8px;cursor:pointer;padding:.25rem" aria-label="Dog">🐶</button>
    <button style="font-size:2rem;background:none;border:2px solid transparent;border-radius:8px;cursor:pointer;padding:.25rem" aria-label="Fox">🦊</button>
    <button style="font-size:2rem;background:none;border:2px solid transparent;border-radius:8px;cursor:pointer;padding:.25rem" aria-label="Owl">🦉</button>
    <button style="font-size:2rem;background:none;border:2px solid transparent;border-radius:8px;cursor:pointer;padding:.25rem" aria-label="Penguin">🐧</button>
    <button style="font-size:2rem;background:none;border:2px solid transparent;border-radius:8px;cursor:pointer;padding:.25rem" aria-label="Robot">🤖</button>
  </div>
  <div class="form-actions">
    <button data-dialog-close>Cancel</button>
  </div>
</hx-dialog>
