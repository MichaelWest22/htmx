<hx-dialog modal role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-desc" id="confirm-dialog">
  <h2 id="confirm-title">Delete item?</h2>
  <p id="confirm-desc">This action cannot be undone. The item will be permanently removed.</p>
  <div class="form-actions">
    <button data-dialog-close>Cancel</button>
    <button autofocus data-dialog-close style="background:#c0392b;color:#fff;border:0;border-radius:3px;padding:.4rem .9rem;cursor:pointer">Delete</button>
  </div>
</hx-dialog>
