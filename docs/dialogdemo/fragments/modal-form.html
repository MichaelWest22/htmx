<hx-dialog modal>
  <h2>Edit item</h2>
  <form>
    <label>
      Title
      <input type="text" name="title" autofocus style="display:block;margin-top:.25rem;width:100%;box-sizing:border-box">
    </label>
    <label style="display:block;margin-top:.75rem">
      Body
      <textarea name="body" rows="4" style="display:block;margin-top:.25rem;width:100%;box-sizing:border-box"></textarea>
    </label>
  </form>
  <div class="form-actions">
    <button type="submit">Save</button>
    <button type="button" data-dialog-close>Cancel</button>
  </div>
</hx-dialog>
