<dialog id="persist-dialog" data-modal data-persist>
  <div data-dialog-titlebar>
    Persistent dialog
    <form method="dialog">
      <button data-dialog-close-btn aria-label="Close">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 1L1 11M11 11L1 1" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
    </form>
  </div>
  <div data-dialog-content>
    <p>This dialog stays in the DOM after close (<code>data-persist</code>).</p>
    <p><label>Type something: <input type="text" name="note" placeholder="preserved between opens"></label></p>
  </div>
  <div data-dialog-footer>
    <form method="dialog"><button value="close">Close</button></form>
  </div>
</dialog>
