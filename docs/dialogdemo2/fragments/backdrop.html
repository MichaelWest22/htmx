<dialog id="drupal-dialog" data-modal closedby="any">
  <div data-dialog-titlebar>
    Click outside to close
    <form method="dialog">
      <button data-dialog-close-btn aria-label="Close">
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <path d="M11 1L1 11M11 11L1 1" stroke="currentColor" stroke-width="1.5"/>
        </svg>
      </button>
    </form>
  </div>
  <div data-dialog-content>
    <p>This dialog uses <code>closedby="any"</code> — click the backdrop or press Escape to close.</p>
    <p>Native in Chrome 133+, Firefox 136+. Polyfilled by the shim for Safari.</p>
  </div>
  <div data-dialog-footer>
    <form method="dialog"><button value="ok">OK</button></form>
  </div>
</dialog>
