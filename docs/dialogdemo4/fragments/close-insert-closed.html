<hx-partial hx-target="#drupal-modal" hx-swap="delete"></hx-partial>
<hx-partial hx-target="body" hx-swap="beforeend">
  <drupal-dialog id="drupal-modal" data-persist>
    <dialog id="drupal-modal-inner" aria-labelledby="drupal-modal-title">
      <div data-dialog-titlebar>
        <span id="drupal-modal-title">Closed by server</span>
        <form method="dialog">
          <button data-dialog-close-btn aria-label="Close">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
              <path d="M11 1L1 11M11 11L1 1" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </button>
        </form>
      </div>
      <div data-dialog-content>
        <p>Server returned this dialog without <code>open</code> — inserted closed. Use <code>commandfor</code> to reopen.</p>
      </div>
      <div data-dialog-footer>
        <form method="dialog"><button value="close">Close</button></form>
      </div>
    </dialog>
  </drupal-dialog>
</hx-partial>
