<hx-partial hx-target="#drupal-modal" hx-swap="delete"></hx-partial>
<hx-partial hx-target="body" hx-swap="beforeend">
  <drupal-dialog id="drupal-modal">
    <dialog open data-modal role="alertdialog" aria-labelledby="alert-title" aria-describedby="alert-desc">
      <div data-dialog-titlebar data-dialog-danger>
        <span id="alert-title">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"
               xmlns="http://www.w3.org/2000/svg" style="vertical-align:-.2em;margin-inline-end:.4em">
            <path d="M8 1L15 14H1L8 1Z" stroke="currentColor" stroke-width="1.5" fill="none"/>
            <path d="M8 6v4M8 11.5v.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          Permanently delete account?
        </span>
        <form method="dialog">
          <button data-dialog-close-btn aria-label="Close">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
              <path d="M11 1L1 11M11 11L1 1" stroke="currentColor" stroke-width="1.5"/>
            </svg>
          </button>
        </form>
      </div>
      <div data-dialog-content>
        <p id="alert-desc">This will permanently delete your account and all associated data.
          This action <strong>cannot be undone</strong>.</p>
      </div>
      <div data-dialog-footer>
        <form method="dialog"><button value="cancel" autofocus>Cancel</button></form>
        <form method="dialog"><button value="delete" class="button--danger">Delete account</button></form>
      </div>
    </dialog>
  </drupal-dialog>
</hx-partial>
